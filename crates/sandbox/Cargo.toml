[package]
name = "lmhub-sandbox"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sandboxed workspace tools for lmhub-runner"

[dependencies]
lmhub-core = { workspace = true }

serde_json = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
