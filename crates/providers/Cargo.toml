[package]
name = "lmhub-providers"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Provider adapters (OpenAI, Anthropic, custom TOML) for lmhub-runner"

[dependencies]
lmhub-core = { workspace = true }
lmhub-modelsdev = { workspace = true }

reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
bytes = "1"
futures = { workspace = true }
jsonwebtoken = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
