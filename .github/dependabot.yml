# Dependabot keeps the SHA-pinned actions and the cargo dependency tree
# current; pins are updated through reviewed PRs, not silently.

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10