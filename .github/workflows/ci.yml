name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Monthly snapshot-drift check (README documents it).
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of every month

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # node is preinstalled on ubuntu runners — required by the sandbox
      # allowlist tests (node/npm/npx).
      - run: cargo test --workspace --locked

  build-release:
    name: build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

  catalog-drift:
    name: models.dev snapshot drift
    runs-on: ubuntu-latest
    # Fails when the bundled catalog no longer matches models.dev (refresh
    # via xtask); scheduled monthly in addition to push/PR runs.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- gen-providers
      - name: Detect changes
        run: |
          if ! git diff --exit-code crates/providers/src/known/known_providers.json >/dev/null; then
            echo "::error::models.dev catalog drifted — regenerate with: cargo run -p xtask -- gen-providers"
            exit 1
          fi
